services:
  - type: web
    name: webhook-automation-runner
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HTTP_DOMAINS
        value: jsonplaceholder.typicode.com
      - key: SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
